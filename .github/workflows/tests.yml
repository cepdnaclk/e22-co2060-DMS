name: Tests

on:
  push:
    branches: [main, Testing]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend unit & integration tests (JUnit + JaCoCo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Run tests (H2 in-memory database)
        working-directory: backend
        run: mvn -B test
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports
          path: |
            backend/target/surefire-reports
            backend/target/site/jacoco

  frontend:
    name: Frontend component tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx vitest run --coverage
        working-directory: frontend
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-reports
          path: frontend/test-results

  api-e2e:
    name: API end-to-end tests (Postman / Newman)
    runs-on: ubuntu-latest
    needs: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dms_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_NAME: dms_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      SERVER_PORT: '8081'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build and start backend
        working-directory: backend
        run: |
          mvn -B -q package -DskipTests
          nohup java -jar target/dms-backend-1.0.0.jar > backend.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:8081/api/tournaments && break; sleep 2; done
      - name: Run Newman
        working-directory: testing
        run: |
          npm ci
          mkdir -p reports/newman
          npm run api
      - name: Upload API report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-e2e-report
          path: testing/reports/newman
