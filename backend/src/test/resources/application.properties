# Test configuration: in-memory H2 in PostgreSQL mode, so tests never touch the real database.
spring.application.name=Debate Management System (test)

spring.datasource.url=jdbc:h2:mem:dms_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Seed data (data.sql) is not loaded; each test creates the data it needs.
spring.sql.init.mode=never

jwt.secret=test-secret-key-that-is-at-least-32-characters-long
jwt.expiration=3600000

cors.origins=http://localhost:5173
logging.level.root=WARN
